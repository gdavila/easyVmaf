# docker-compose.yml
# Usage:
#   VIDEO_DIR=/path/to/videos docker compose run easyvmaf \
#     -d /videos/distorted.mp4 -r /videos/reference.mp4

services:
  easyvmaf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FFMPEG_version: "8.1"
        VMAF_version: "3.2.1"
    image: easyvmaf:latest
    volumes:
      - ${VIDEO_DIR:?set VIDEO_DIR to the directory with your videos}:/videos
    # Default command — override at runtime
    # Example: docker compose run easyvmaf -d /videos/dist.mp4 -r /videos/ref.mp4

  easyvmaf-cuda:
    build:
      context: .
      dockerfile: Dockerfile.cuda
      args:
        FFMPEG_version: "8.1"
        VMAF_version: "3.2.1"
    image: easyvmaf:cuda
    volumes:
      - ${VIDEO_DIR:?set VIDEO_DIR to the directory with your videos}:/videos
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
