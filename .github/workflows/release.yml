# Builds easyvmaf and publishes it with PyPI Trusted Publishing (no tokens):
# - push of a tag v<version> -> PyPI (environment pypi); the tag must equal
#   easyvmaf.__version__
# - workflow_dispatch -> TestPyPI (environment testpypi) as <version>.dev<run number>
#
# Tests do not run here: the integration tests need FFmpeg built with libvmaf.
# Run the full test suite locally before pushing the tag.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

# One release run per ref at a time; never cancel a run that may be publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Check that the tag matches easyvmaf.__version__
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import ast, sys; print(next(n.value.value for n in ast.parse(open("easyvmaf/__init__.py").read()).body if isinstance(n, ast.Assign) and any(getattr(t, "id", None) == "__version__" for t in n.targets)))')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match easyvmaf.__version__ $version"
            exit 1
          fi

      - name: Make the TestPyPI version unique
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          sed -i -E "s/^__version__ = \"([^\"]+)\"$/__version__ = \"\1.dev${RUN_NUMBER}\"/" easyvmaf/__init__.py
          grep -E "^__version__ = \"[^\"]+\.dev${RUN_NUMBER}\"$" easyvmaf/__init__.py

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Smoke test the wheel with the minimum Python
        run: |
          cd "$RUNNER_TEMP"
          uvx --python 3.10 --from "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)" easyvmaf --help

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/easyvmaf/
    permissions:
      id-token: write # Trusted Publishing: OIDC token exchanged with the index
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/easyvmaf/
    permissions:
      id-token: write # Trusted Publishing: OIDC token exchanged with the index
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
